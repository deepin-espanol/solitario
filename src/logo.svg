<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#dddddd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d442"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#2a5298" stroke-width="4"/>

  <!-- Card 3 (back, left) -->
  <g transform="translate(256,260) rotate(-28) translate(-75,-105)" filter="url(#shadow)">
    <rect width="150" height="210" rx="10" fill="#2856a8" stroke="#1a3a7a" stroke-width="2"/>
    <rect x="12" y="12" width="126" height="186" rx="6" fill="none" stroke="#4a7ad4" stroke-width="1.5" opacity="0.5"/>
    <!-- Diamond pattern on back -->
    <path d="M75 40 L95 75 L75 110 L55 75 Z" fill="none" stroke="#5a8ae4" stroke-width="1.5" opacity="0.4"/>
    <path d="M75 100 L95 135 L75 170 L55 135 Z" fill="none" stroke="#5a8ae4" stroke-width="1.5" opacity="0.4"/>
    <circle cx="75" cy="75" r="8" fill="none" stroke="#6a9af4" stroke-width="1" opacity="0.3"/>
    <circle cx="75" cy="135" r="8" fill="none" stroke="#6a9af4" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Card 2 (back, right) -->
  <g transform="translate(256,260) rotate(28) translate(-75,-105)" filter="url(#shadow)">
    <rect width="150" height="210" rx="10" fill="#2856a8" stroke="#1a3a7a" stroke-width="2"/>
    <rect x="12" y="12" width="126" height="186" rx="6" fill="none" stroke="#4a7ad4" stroke-width="1.5" opacity="0.5"/>
    <path d="M75 40 L95 75 L75 110 L55 75 Z" fill="none" stroke="#5a8ae4" stroke-width="1.5" opacity="0.4"/>
    <path d="M75 100 L95 135 L75 170 L55 135 Z" fill="none" stroke="#5a8ae4" stroke-width="1.5" opacity="0.4"/>
    <circle cx="75" cy="75" r="8" fill="none" stroke="#6a9af4" stroke-width="1" opacity="0.3"/>
    <circle cx="75" cy="135" r="8" fill="none" stroke="#6a9af4" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Card 1 (front, center) -->
  <g transform="translate(256,260) translate(-75,-105)" filter="url(#shadow)">
    <rect width="150" height="210" rx="10" fill="url(#card1)" stroke="#ccc" stroke-width="2"/>

    <!-- Top-left: A of Hearts -->
    <text x="16" y="34" font-family="serif" font-size="22" font-weight="bold" fill="#cc2233">A</text>
    <text x="18" y="52" font-family="serif" font-size="16" fill="#cc2233">&#9829;</text>

    <!-- Center heart -->
    <text x="75" y="125" font-family="serif" font-size="64" fill="#cc2233" text-anchor="middle" opacity="0.9">&#9829;</text>

    <!-- Bottom-right (rotated) -->
    <g transform="translate(150,210) rotate(180)">
      <text x="16" y="34" font-family="serif" font-size="22" font-weight="bold" fill="#cc2233">A</text>
      <text x="18" y="52" font-family="serif" font-size="16" fill="#cc2233">&#9829;</text>
    </g>
  </g>

  <!-- Small suit symbols floating -->
  <g filter="url(#glow)" opacity="0.7">
    <text x="100" y="120" font-family="serif" font-size="28" fill="#f5d442">&#9830;</text>
    <text x="385" y="140" font-family="serif" font-size="22" fill="#4ac4f0">&#9824;</text>
    <text x="90" y="400" font-family="serif" font-size="20" fill="#4ac4f0">&#9827;</text>
    <text x="395" y="390" font-family="serif" font-size="26" fill="#f5d442">&#9829;</text>
  </g>

  <!-- Title text -->
  <text x="256" y="478" font-family="sans-serif" font-size="28" font-weight="bold" fill="#e0e8f5" text-anchor="middle" letter-spacing="4">SOLITARIO</text>
</svg>
