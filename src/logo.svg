<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="felt" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2fae5f"/>
      <stop offset="100%" stop-color="#0b5a30"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eeeee6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#felt)"/>
  <!-- Fundacion: As de corazones -->
  <g filter="url(#sh)">
    <rect x="72" y="14" width="40" height="56" rx="6" fill="url(#card)" stroke="#b9b9b0"/>
    <text x="78" y="30" font-family="sans-serif" font-weight="bold" font-size="13" fill="#d12a32">A</text>
    <text x="92" y="58" font-family="sans-serif" font-size="26" fill="#d12a32" text-anchor="middle">&#9829;</text>
  </g>
  <!-- Columna en cascada: K negro, Q roja, J negra -->
  <g font-family="sans-serif" font-weight="bold" filter="url(#sh)">
    <rect x="16" y="16" width="46" height="64" rx="6" fill="url(#card)" stroke="#b9b9b0"/>
    <text x="22" y="31" font-size="13" fill="#1c1c1c">K&#9824;</text>
    <rect x="16" y="36" width="46" height="64" rx="6" fill="url(#card)" stroke="#b9b9b0"/>
    <text x="22" y="51" font-size="13" fill="#d12a32">Q&#9829;</text>
    <rect x="16" y="56" width="46" height="60" rx="6" fill="url(#card)" stroke="#b9b9b0"/>
    <text x="22" y="71" font-size="13" fill="#1c1c1c">J&#9827;</text>
    <text x="39" y="104" font-size="30" font-weight="normal" fill="#1c1c1c" text-anchor="middle">&#9827;</text>
  </g>
  <!-- Mazo boca abajo -->
  <g filter="url(#sh)">
    <rect x="72" y="76" width="40" height="40" rx="6" fill="#2b4fae" stroke="#ffffff" stroke-width="2"/>
    <rect x="78" y="82" width="28" height="28" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>
    <path d="M78 96 L92 82 L106 96 L92 110 Z" fill="#ffffff" fill-opacity="0.25"/>
  </g>
</svg>
