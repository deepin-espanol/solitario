version: "1"

package:
  id: org.deepinenespanol.solitario
  name: Solitario
  version: 1.0.3.0
  kind: app
  description: |
    Klondike, Spider and FreeCell card games for Deepin built with Qt6 and DTK6.

command:
  - /opt/apps/org.deepinenespanol.solitario/files/bin/solitario

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# Se empaqueta el .deb ya compilado (el CI lo deja en debs/).
# Se lee de /project/debs/ porque ll-builder vacia linglong/sources.
build: |
  dpkg-deb -X /project/debs/solitario_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  mv $PREFIX/share/applications/solitario.desktop $PREFIX/share/applications/org.deepinenespanol.solitario.desktop
  sed -i 's#^Exec=.*#Exec=/opt/apps/org.deepinenespanol.solitario/files/bin/solitario#' \
      $PREFIX/share/applications/org.deepinenespanol.solitario.desktop

sources: []
